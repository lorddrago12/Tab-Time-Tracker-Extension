<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Tab Time Tracker</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <!-- Header -->
  <div class="header">
    <div class="header-title">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>
      </svg>
      Time Tracker
    </div>
    <div class="day-selector" role="group" aria-label="Time period">
      <button class="day-btn active" data-period="today">Today</button>
      <button class="day-btn" data-period="week">Week</button>
      <button class="day-btn" data-period="month">Month</button>
    </div>
  </div>

  <!-- Summary cards -->
  <div class="summary" id="summary">
    <div class="stat-card">
      <span class="stat-label">Total time</span>
      <span class="stat-val" id="stat-total">—</span>
      <span class="stat-sub" id="stat-total-sub">&nbsp;</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Sites visited</span>
      <span class="stat-val" id="stat-sites">—</span>
      <span class="stat-sub" id="stat-sites-sub">&nbsp;</span>
    </div>
    <div class="stat-card">
      <span class="stat-label">Productive</span>
      <span class="stat-val" id="stat-prod">—</span>
      <span class="stat-sub" id="stat-prod-sub">&nbsp;</span>
    </div>
  </div>

  <!-- Breakdown bar -->
  <div class="section">
    <div class="section-label">Time breakdown</div>
    <div class="breakdown-bar" id="breakdown-bar" role="img" aria-label="Time category breakdown bar"></div>
    <div class="legend" id="legend"></div>
  </div>

  <!-- Top sites list -->
  <div class="section sites-section">
    <div class="section-header">
      <span class="section-label" style="margin-bottom:0">Top sites</span>
      <button class="sort-btn" id="sort-btn" aria-label="Toggle sort order">
        <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/>
          <line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/>
          <line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>
        </svg>
        Sort
      </button>
    </div>
    <div id="sites-list">
      <div class="empty-state">No data yet — browse around and come back!</div>
    </div>
  </div>

  <!-- Footer -->
  <div class="footer">
    <div class="live-indicator">
      <div class="live-dot" id="live-dot"></div>
      <span id="live-label">Loading...</span>
    </div>
    <button class="export-btn" id="export-btn" aria-label="Export data as JSON">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
        <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
        <polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>
      </svg>
      Export
    </button>
  </div>

  <script src="popup.js"></script>
</body>
</html>
